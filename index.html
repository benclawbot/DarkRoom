<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DarkRoom</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=24" />
  <link rel="stylesheet" href="focused-editor.css?v=24" />
  <link rel="stylesheet" href="refine-ui.css?v=24" />
  <link rel="stylesheet" href="crop-ui.css?v=26" />
  <link rel="stylesheet" href="typography.css?v=1" />
</head>
<body class="focused-darkroom">
<div id="app">
  <input id="fileInput" type="file" accept="image/*,.dng,.cr2,.cr3,.nef,.nrw,.arw,.srf,.sr2,.raf,.orf,.rw2,.pef,.rwl,.3fr,.fff,.iiq,.mos,.mrw,.x3f" hidden />

  <div id="editor" class="editor" aria-hidden="false">
    <header class="editor-top">
      <div class="editor-title empty">
        <svg class="app-aperture-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M14.3 3.3 10 10.8"></path>
          <path d="M20.1 8.1h-8.6"></path>
          <path d="m17.8 18.6-4.3-7.5"></path>
          <path d="m9.7 20.7 4.3-7.5"></path>
          <path d="M3.9 15.9h8.6"></path>
          <path d="m6.2 5.4 4.3 7.5"></path>
        </svg>
        <span class="editor-title-copy"><b id="editorName">DarkRoom</b><small id="editorMeta">Single-photo editor</small></span>
      </div>
      <div class="editor-history" aria-label="Edit history">
        <button id="undoBtn" title="Undo" aria-label="Undo">↶</button>
        <button id="redoBtn" title="Redo" aria-label="Redo">↷</button>
        <button id="beforeAfterBtn" title="Before / after" aria-label="Toggle before and after" aria-pressed="false">◐</button>
        <button id="beforeSplitBtn" title="Split before / after" aria-label="Split before and after" aria-pressed="false">↔</button>
      </div>
      <div class="editor-top-actions">
        <button id="topOpenPhoto" class="editor-icon open-photo-top" title="Open photo" aria-label="Open a new photo">＋</button>
        <button id="fullscreenBtn" class="editor-icon" title="Picture only (F)" aria-label="Show picture only" aria-pressed="false">⛶</button>
        <button id="exportBtn" class="export-button">Export</button>
      </div>
    </header>

    <section id="photoViewport" class="editor-stage" aria-label="Zoomable photo viewport">
      <div id="editorEmptyPicker" class="editor-empty-picker">
        <div class="editor-empty-card"><button id="editorOpenPhoto">＋ Open Photo</button><span>Choose one photo to start editing</span></div>
      </div>
      <div id="editorFallbackImage" class="editor-image-fallback" role="img" aria-label="Photo preview" aria-hidden="true"></div>
      <div id="canvasWrap" class="canvas-wrap">
        <canvas id="editorCanvas"></canvas>
        <canvas id="beforeSplitCanvas" class="before-split-canvas" aria-hidden="true"></canvas>
        <canvas id="maskOverlay" class="mask-overlay" aria-hidden="true"></canvas>
        <canvas id="diagnosticOverlay" class="diagnostic-overlay" aria-hidden="true"></canvas>
        <div id="beforeSplitDivider" class="before-split-divider hidden"></div>
        <div id="compositionOverlay" class="composition-overlay none"></div>
      </div>
      <input id="beforeSplitRange" class="before-split-range hidden" type="range" min="0" max="100" value="50" aria-label="Before and after split position" />
      <div id="paintHud" class="paint-hud hidden"><b>Edit on photo</b><span>Drag on photo · Esc to finish</span></div>
      <div id="renderStatus" class="render-status hidden" role="status">Rendering preview…</div>
      <div class="zoom-controls" aria-label="Zoom controls">
        <button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomReset" aria-label="Reset zoom"><span id="zoomLabel">100%</span></button><button id="zoomIn" aria-label="Zoom in">＋</button>
      </div>
      <button id="mobileFullscreenBtn" class="mobile-fullscreen-button hidden" aria-label="Picture only">⛶</button>
    </section>

    <aside id="editorPanel" class="editor-panel" aria-label="Editing tools">
      <div class="panel-header">
        <div class="histogram-block"><span>Histogram</span><canvas id="histogramCanvas" width="320" height="76" aria-label="RGB histogram"></canvas><div id="histogramToneStrip" class="histogram-tone-strip" aria-label="Tone range controls"><button class="hist-tone-handle" data-tone="shadows" title="Shadows" aria-label="Shadows"></button><button class="hist-tone-handle" data-tone="midtones" title="Midtones" aria-label="Midtones"></button><button class="hist-tone-handle" data-tone="highlights" title="Highlights" aria-label="Highlights"></button></div></div>
      </div>
      <div id="toolTabs" class="tool-tabs context-tools" aria-label="Editing tools"></div>
      <div id="controls" class="controls hidden"></div>
      <div class="editor-footer"><button id="resetEdits">Reset</button><button id="copyEdits">Copy</button><button id="pasteEdits">Paste</button></div>
    </aside>
  </div>

  <div id="exportSheet" class="focused-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <div class="focused-sheet-card">
      <div class="focused-sheet-head"><h2 id="exportTitle">Export photograph</h2><button id="closeExportSheet" aria-label="Close">×</button></div>
      <div class="focused-export-grid">
        <label>Format <select id="exportFormat"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option><option value="image/avif">AVIF</option><option value="image/tiff">TIFF</option></select></label>
        <label>Quality <span><input id="exportQuality" type="range" min="40" max="100" value="92"><b id="exportQualityValue">92%</b></span></label>
        <label>Long edge <input id="exportLongEdge" type="number" min="0" max="8192" step="100" placeholder="Original"></label>
        <label>Sharpen <select id="exportSharpen"><option value="none">None</option><option value="screen">Screen</option><option value="print">Print</option></select></label>
      </div>
      <div class="focused-sheet-actions"><button id="cancelExport">Cancel</button><button id="confirmExport" class="primary-action">Export</button></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script src="engine-core.js?v=24"></script>
<script src="raw-runtime.js?v=24"></script>
<script src="core.js?v=24"></script>
<script src="library.js?v=24"></script>
<script src="renderer.js?v=24"></script>
<script src="editor.js?v=24"></script>
<script src="preset-engine.js?v=24"></script>
<script src="presetpro-presets.js?v=24"></script>
<script src="focused-editor.js?v=24"></script>
<script src="refine-ui.js?v=24"></script>
<script src="crop-ui.js?v=26"></script>
<script src="performance-ui.js?v=1"></script>
<script src="app.js?v=25"></script>
</body>
</html>
